syntax = "proto3";

package booking.v1;

import "google/protobuf/timestamp.proto";

service BookingService {
    // Получение всех активных броней пользователя
    rpc GetUserBookings (GetUserBookingsRequest) returns (GetUserBookingsResponse);
    // Получение одной брони по id (с проверкой владельца)
    rpc GetBooking (GetBookingRequest) returns (GetBookingResponse);
    // создание брони
    rpc CreateReservation (CreateReservationRequest) returns (CreateReservationResponse);   
    // подтверждение брони
    rpc ConfirmBooking (ConfirmBookingRequest) returns (ConfirmBookingResponse);
    // отмена брони (при возврате платежа)
    rpc CancelBooking (CancelBookingRequest) returns (CancelBookingResponse);
    // получение занятых мест
    rpc ListReservedSeats (ListReservedSeatsRequest) returns (ListReservedSeatsResponse);

    // ===== Касса: смены и продажи =====
    // Продажа на кассе: бронь + подтверждение + учёт в открытой смене кассира.
    rpc CreateCashierSale (CreateCashierSaleRequest) returns (CreateCashierSaleResponse);
    // Открыть смену (одна открытая смена на кассира).
    rpc OpenShift (OpenShiftRequest) returns (Shift);
    // Закрыть смену — возвращает отчёт со сверкой кассы.
    rpc CloseShift (CloseShiftRequest) returns (ShiftReport);
    // Текущая открытая смена кассира (NOT_FOUND, если нет).
    rpc GetCurrentShift (GetCurrentShiftRequest) returns (Shift);
    // Продажи смены.
    rpc ListShiftSales (ListShiftSalesRequest) returns (ListShiftSalesResponse);

    // ===== 3.11.0: пригласительные, аннулирование, журнал, печать =====
    // Выдать пригласительные билеты (0 ₽, без оплаты) — только ADMIN.
    rpc IssueComplimentary (IssueComplimentaryRequest) returns (IssueComplimentaryResponse);
    // Аннулировать заказ: место освобождается, билеты → VOIDED, запись в журнал.
    // Идемпотентно. Деньги покупателю НЕ возвращаются (это отдельная операция).
    rpc VoidOrder (VoidOrderRequest) returns (VoidOrderResponse);
    // Убрать все пригласительные сеанса после матча (bulk void).
    rpc ArchiveScreeningComps (ArchiveScreeningCompsRequest) returns (ArchiveScreeningCompsResponse);
    // Админский список заказов (по умолчанию без VOIDED и COMP).
    rpc ListOrders (ListOrdersRequest) returns (ListOrdersResponse);
    // Журнал действий по билетам (выдача пригласительных / аннулирование).
    rpc ListTicketAudit (ListTicketAuditRequest) returns (ListTicketAuditResponse);
    // Печатные представления билетов заказа (для термопечати / повторной печати).
    rpc GetPrintableTickets (GetPrintableTicketsRequest) returns (GetPrintableTicketsResponse);
    // Проверка билета по id из QR (контроль на входе). Read-only.
    rpc ValidateTicket (ValidateTicketRequest) returns (ValidateTicketResponse);
    // Макет термопечати: общий по умолчанию + переопределения под событие (3.12.0).
    rpc GetPrintTemplate (GetPrintTemplateRequest) returns (GetPrintTemplateResponse);
    rpc SetPrintTemplate (SetPrintTemplateRequest) returns (SetPrintTemplateResponse);
}

// ===== Cashier =====

message CreateCashierSaleRequest {
    string cashier_id = 1;
    string screening_id = 2;
    repeated SeatInput seats = 3;
    // cash | terminal
    string payment_type = 4;
    // id аккаунта покупателя, если есть; иначе продажа привязывается к кассиру.
    optional string customer_id = 5;
    optional string audience_code = 6;
    optional string promo_code = 7;
    // Списать баллы лояльности покупателя (копейки; нужен customer_id).
    int32 redeem_points = 8;
}

message CreateCashierSaleResponse {
    string order_id = 1;
    repeated string ticket_ids = 2;
    int32 amount = 3;
    string qr_code = 4;
    // 3.11.0: печатные представления каждого билета (отдельный QR на билет).
    repeated PrintableTicket tickets = 5;
}

enum ShiftStatus {
    OPEN = 0;
    CLOSED = 1;
}

message OpenShiftRequest {
    string cashier_id = 1;
    // наличные в кассе на начало смены (копейки)
    int32 opening_cash = 2;
}

message CloseShiftRequest {
    string cashier_id = 1;
    // фактически пересчитанные наличные на конец смены (копейки)
    int32 counted_cash = 2;
}

message GetCurrentShiftRequest {
    string cashier_id = 1;
}

message Shift {
    string id = 1;
    string cashier_id = 2;
    ShiftStatus status = 3;
    int32 opening_cash = 4;
    google.protobuf.Timestamp opened_at = 5;
    optional google.protobuf.Timestamp closed_at = 6;
}

message ShiftReport {
    Shift shift = 1;
    int32 sales_count = 2;
    // сумма всех продаж смены (копейки)
    int32 total = 3;
    int32 cash_total = 4;
    int32 terminal_total = 5;
    // opening_cash + cash_total
    int32 expected_cash = 6;
    int32 counted_cash = 7;
    // counted_cash - expected_cash (отрицательное — недостача)
    int32 difference = 8;
}

message ListShiftSalesRequest {
    string cashier_id = 1;
    // по умолчанию — текущая открытая смена
    optional string shift_id = 2;
}

message ListShiftSalesResponse {
    repeated CashierSaleItem sales = 1;
}

message CashierSaleItem {
    string order_id = 1;
    string screening_id = 2;
    int32 amount = 3;
    string payment_type = 4;
    google.protobuf.Timestamp sold_at = 5;
}

message GetUserBookingsRequest {
    string user_id = 1;
}

message GetUserBookingsResponse {
    repeated BookingItem bookings = 1;
}

message GetBookingRequest {
    string id = 1;
    string user_id = 2;
}

message GetBookingResponse {
    BookingItem booking = 1;
}

message CreateReservationRequest {
    string user_id = 1;
    string screening_id = 2;
    repeated SeatInput seats = 3;
    optional string audience_code = 4;
    optional string promo_code = 5;
}

message CreateReservationResponse {
    string order_id = 1;
    repeated string ticket_ids = 2;
    int32 amount = 3;
}

message SeatInput {
    string seat_id = 1;
}

message ConfirmBookingRequest {
    string booking_id = 1;
    string user_id = 2;
}

message ConfirmBookingResponse {
    bool ok = 1;
}

message CancelBookingRequest {
    string booking_id = 1;
    string user_id = 2;
}

message CancelBookingResponse {
    bool ok = 1;
}

message ListReservedSeatsRequest {
    string sector_id = 1;
    string screening_id = 2;
}

message ListReservedSeatsResponse {
    repeated string reserved_seat_ids = 1;
}

message BookingSeatInfo {
    string id = 1;
    int32 row = 2;
    int32 number = 3;
    // 3.7.0: заказ может охватывать несколько секторов — сектор у каждого места.
    string sector_name = 4;
    // 3.11.0: отдельный билет и его QR (для термопечати и контроля на входе).
    string ticket_id = 5;
    // data-URI PNG; у исторических билетов пусто — фолбэк на BookingItem.qr_code.
    string qr_code = 6;
}

message BookingEventInfo {
    string id = 1;
    string title = 2;
    string poster = 3;
}

message BookingArenaInfo {
    string id = 1;
    string name = 2;
}

message BookingItem {
    string id = 1;
    string screening_date = 2;
    string screening_time = 3;
    BookingEventInfo event = 4;
    BookingArenaInfo arena = 5;
    // 6 (BookingSectorInfo sector) удалён в 3.7.0 — сектор теперь у каждого места.
    repeated BookingSeatInfo seats = 7;
    string qr_code = 8;
    // 3.11.0: SALE | COMP; статус заказа (PAID / VOIDED / ...).
    string kind = 9;
    string status = 10;
}

// ===== 3.11.0 =====

// Печатное представление одного билета (термопринтер / повторная печать).
message PrintableTicket {
    string ticket_id = 1;
    string order_id = 2;
    string event_title = 3;
    string screening_date = 4;
    string screening_time = 5;
    string venue_name = 6;
    string sector_name = 7;
    int32 row = 8;
    int32 number = 9;
    // копейки; у пригласительных 0.
    int32 price = 10;
    // строка, которую кодирует QR (обычно ticket_id).
    string qr_data = 11;
    bool is_comp = 12;
    // 3.12.0: id события — чтобы выбрать макет печати события.
    string event_id = 13;
}

message IssueComplimentaryRequest {
    string screening_id = 1;
    repeated SeatInput seats = 2;
    // id админа, выдавшего пригласительные.
    string issued_by = 3;
    string note = 4;
}

message IssueComplimentaryResponse {
    string order_id = 1;
    repeated PrintableTicket tickets = 2;
}

message VoidOrderRequest {
    string order_id = 1;
    string actor_id = 2;
    string reason = 3;
}

message VoidOrderResponse {
    // false, если заказ уже был VOIDED (идемпотентный no-op).
    bool changed = 1;
}

message ArchiveScreeningCompsRequest {
    string screening_id = 1;
    string actor_id = 2;
}

message ArchiveScreeningCompsResponse {
    int32 voided_orders = 1;
}

message ListOrdersRequest {
    optional string screening_id = 1;
    // фильтр по статусу заказа; пусто = активные (без VOIDED).
    optional string status = 2;
    // SALE | COMP; пусто = только SALE.
    optional string kind = 3;
    optional string cursor = 4;
    int32 limit = 5;
}

message OrderListItem {
    string id = 1;
    string kind = 2;
    string status = 3;
    int32 amount = 4;
    google.protobuf.Timestamp created_at = 5;
    string screening_id = 6;
    string event_title = 7;
    int32 seat_count = 8;
    // касса | онлайн | пригласительный — краткий признак для списка.
    string source = 9;
}

message ListOrdersResponse {
    repeated OrderListItem orders = 1;
    string next_cursor = 2;
}

message ListTicketAuditRequest {
    optional string screening_id = 1;
    optional google.protobuf.Timestamp from = 2;
    optional google.protobuf.Timestamp to = 3;
    // ISSUED_COMP | VOIDED | COMP_ARCHIVED
    optional string action = 4;
    optional string cursor = 5;
    int32 limit = 6;
}

message TicketAuditItem {
    string id = 1;
    string action = 2;
    string actor_id = 3;
    string order_id = 4;
    string ticket_id = 5;
    string reason = 6;
    google.protobuf.Timestamp created_at = 7;
    string meta_json = 8;
}

message ListTicketAuditResponse {
    repeated TicketAuditItem entries = 1;
    string next_cursor = 2;
}

message GetPrintableTicketsRequest {
    string order_id = 1;
}

message GetPrintableTicketsResponse {
    repeated PrintableTicket tickets = 1;
}

message ValidateTicketRequest {
    string ticket_id = 1;
}

message ValidateTicketResponse {
    // true, только если билет активен (PAID и не VOIDED).
    bool valid = 1;
    // PAID | VOIDED | RESERVED | NOT_FOUND
    string status = 2;
    bool is_comp = 3;
    string event_title = 4;
    string screening_date = 5;
    string screening_time = 6;
    string venue_name = 7;
    string sector_name = 8;
    int32 row = 9;
    int32 number = 10;
}

message GetPrintTemplateRequest {
    // 3.12.0: пусто = общий макет по умолчанию; иначе — макет события
    // (с откатом на умолчание, если у события своего нет).
    string event_id = 1;
}

message GetPrintTemplateResponse {
    // JSON-строка с настройками макета.
    string settings_json = 1;
    // 3.12.0: true, если вернулся макет самого события, а не общий по умолчанию.
    bool is_override = 2;
}

message SetPrintTemplateRequest {
    string settings_json = 1;
    // 3.12.0: пусто = общий макет по умолчанию.
    string event_id = 2;
    // 3.12.0: true + event_id → удалить макет события (вернуться к умолчанию).
    bool delete = 3;
}

message SetPrintTemplateResponse {
    bool ok = 1;
}