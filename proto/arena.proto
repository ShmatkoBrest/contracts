syntax = "proto3";

package arena.v1;

import "google/protobuf/empty.proto";

service ArenaService {
    // получение списка арен
    rpc ListArenas (google.protobuf.Empty) returns (ListArenasResponse);
    // получение арены по id
    rpc GetArena (GetArenaRequest) returns (GetArenaResponse);
    // создание арены
    rpc CreateArena (CreateArenaRequest) returns (CreateArenaResponse);
    // обновление арены
    rpc UpdateArena (UpdateArenaRequest) returns (UpdateArenaResponse);
    // удаление арены
    rpc DeleteArena (DeleteArenaRequest) returns (DeleteArenaResponse);
}

message ListArenasResponse {
    repeated Arena arenas = 1;
}

message GetArenaRequest {
    string id = 1;
}

message GetArenaResponse {
    Arena arena = 1;
}

message CreateArenaRequest {
    string name    = 1;
    string address = 2;
    string image   = 3;
    // id города (city.v1, FK внутри arena-service). Опционально для обратной совместимости.
    optional string city_id = 4;
    // S3-ключ схемы зала (подложка конструктора, §12). Отличается от image
    // (фото площадки для карточек).
    optional string plan_image = 5;
}

message CreateArenaResponse {
    Arena arena = 1;
}

message UpdateArenaRequest {
    string id      = 1;
    string name    = 2;
    string address = 3;
    string image   = 4;
    optional string city_id = 5;
    optional string plan_image = 6;
}

message UpdateArenaResponse {
    Arena arena = 1;
}

message DeleteArenaRequest {
    string id = 1;
}

message DeleteArenaResponse {
  bool ok = 1;
}

message Arena {
    string id      = 1;
    string name    = 2;
    string address = 3;
    string image   = 4;
    optional string city_id = 5;
    // slug города, денормализовано при чтении (для афиши/фронта без доп. запроса).
    optional string city_slug = 6;
    optional string plan_image = 7;
}