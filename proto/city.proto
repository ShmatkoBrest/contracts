syntax = "proto3";

package city.v1;

// Справочник городов платформы. Живёт в arena-service (арены физически
// находятся в городах; конструктор зала привязывает арену к городу).
// event-service ссылается на город по slug-строке (поле Event.place),
// без кросс-сервисного FK.
service CityService {
    // Список всех городов (для афиши и конструктора).
    rpc ListCities (ListCitiesRequest) returns (ListCitiesResponse);
    // Город по id или slug.
    rpc GetCity (GetCityRequest) returns (GetCityResponse);
    rpc CreateCity (CreateCityRequest) returns (CityResponse);
    rpc UpdateCity (UpdateCityRequest) returns (CityResponse);
    rpc DeleteCity (DeleteCityRequest) returns (DeleteCityResponse);
}

message City {
    string id = 1;
    // Уникальный человекочитаемый ключ (`brest`, `minsk`) — на него
    // ссылается event-service и фронтенд в URL.
    string slug = 2;
    string name = 3;
    // Координаты центра города (для карт/сортировки по близости) — опционально.
    optional double lat = 4;
    optional double lng = 5;
    // Порядок в списке (меньше — выше).
    int32 sort_order = 6;
}

message ListCitiesRequest {}

message ListCitiesResponse {
    repeated City cities = 1;
}

message GetCityRequest {
    oneof key {
        string id = 1;
        string slug = 2;
    }
}

message GetCityResponse {
    City city = 1;
}

message CreateCityRequest {
    string slug = 1;
    string name = 2;
    optional double lat = 3;
    optional double lng = 4;
    optional int32 sort_order = 5;
}

message UpdateCityRequest {
    string id = 1;
    optional string slug = 2;
    optional string name = 3;
    optional double lat = 4;
    optional double lng = 5;
    optional int32 sort_order = 6;
}

message CityResponse {
    City city = 1;
}

message DeleteCityRequest {
    string id = 1;
}

message DeleteCityResponse {
    bool ok = 1;
}
