syntax = "proto3";

package notification.v1;

// Настройки отправки SMS и email (OTP, смена контакта, письма с билетами).
// Два уровня: платформенный (общий сайт — Get/Set*Settings) и
// организаторский (Get/SetOrganizerNotificationSettings — только для
// организаторов с включённым модулем "notifications", проверяет
// gateway-service). Организатор не заполнил канал — используются
// платформенные настройки этого канала. Секреты живут здесь, а не в
// content.v1 — ListContent там отдаётся ПУБЛИЧНО без авторизации на каждой
// странице сайта. Вызывается только gateway-service, собственной
// авторизации нет.
service NotificationSettingsService {
    rpc GetSmsSettings (GetSmsSettingsRequest) returns (SmsSettings);
    rpc SetSmsSettings (SetSmsSettingsRequest) returns (SmsSettings);

    rpc GetEmailSettings (GetEmailSettingsRequest) returns (EmailSettings);
    rpc SetEmailSettings (SetEmailSettingsRequest) returns (EmailSettings);

    rpc GetOrganizerNotificationSettings (GetOrganizerNotificationSettingsRequest) returns (OrganizerNotificationSettings);
    rpc SetOrganizerNotificationSettings (SetOrganizerNotificationSettingsRequest) returns (OrganizerNotificationSettings);
}

message GetSmsSettingsRequest {
}

// SMS_ASSISTENT — исторический провайдер (sms-assistent.by). Его credentials
// раньше жили только в переменных окружения SMS_USER/SMS_PASSWORD/SMS_SENDER/
// SMS_BASE_URL — это остаётся рабочим фолбэком, пока в БД ни разу не
// сохранялись настройки (см. SmsSettings.configured).
enum SmsProvider {
    SMS_PROVIDER_UNSPECIFIED = 0;
    SMS_ASSISTENT = 1;
    MTS = 2;
}

message SmsSettings {
    // false — в БД ещё нет сохранённой записи, платформа работает на
    // переменных окружения (исторический SMS_ASSISTENT). true — админ хотя
    // бы раз сохранил настройки через админку, они и определяют отправку.
    bool configured = 1;
    SmsProvider provider = 2;
    bool enabled = 3;

    string assistent_base_url = 4;
    string assistent_user = 5;
    string assistent_password = 6;
    string assistent_sender = 7;

    // МТС «Коммуникатор», JSONv2 API — POST {base_url}/{client_id}/json2/simple,
    // HTTP Basic (login/password). phone_number передаётся в международном
    // формате без "+".
    string mts_base_url = 8;
    string mts_client_id = 9;
    string mts_login = 10;
    string mts_password = 11;
    // Альфа-имя отправителя — согласовывается с МТС отдельно от учётки.
    string mts_alpha_name = 12;
    // TTL сообщения в секундах (МТС API): 40..86400.
    int32 mts_ttl_seconds = 13;
}

message SetSmsSettingsRequest {
    SmsProvider provider = 1;
    bool enabled = 2;

    string assistent_base_url = 3;
    string assistent_user = 4;
    // Не задано (proto3 "optional" — presence отслеживается) — не менять
    // сохранённый пароль; пришла пустая строка "" — явно очистить его.
    // Голое string здесь не подошло бы: wire-уровень не отличил бы
    // "не передано" от "передано пустое".
    optional string assistent_password = 5;
    string assistent_sender = 6;

    string mts_base_url = 7;
    string mts_client_id = 8;
    string mts_login = 9;
    optional string mts_password = 10;
    string mts_alpha_name = 11;
    int32 mts_ttl_seconds = 12;
}

// ===== Email (SMTP), платформенный уровень =====

message GetEmailSettingsRequest {
}

message EmailSettings {
    // false — в БД ещё нет записи, используются переменные окружения SMTP_*.
    bool configured = 1;
    string smtp_host = 2;
    int32 smtp_port = 3;
    string smtp_username = 4;
    string smtp_password = 5;
    bool smtp_secure = 6;
    string from_address = 7;
}

message SetEmailSettingsRequest {
    string smtp_host = 1;
    int32 smtp_port = 2;
    string smtp_username = 3;
    // Не передано — пароль не меняется; "" — очистить (см. SetSmsSettingsRequest).
    optional string smtp_password = 4;
    bool smtp_secure = 5;
    string from_address = 6;
}

// ===== Настройки организатора (SMS + email) =====

message GetOrganizerNotificationSettingsRequest {
    string organizer_id = 1;
}

// Значения — ЭФФЕКТИВНЫЕ: свои у организатора, если канал настроен, иначе
// платформенные (то, что реально будет использовано при отправке). Флаги
// *_configured говорят, свои ли это (true) или унаследованные (false).
message OrganizerNotificationSettings {
    string organizer_id = 1;
    bool sms_configured = 2;
    SmsSettings sms = 3;
    bool email_configured = 4;
    EmailSettings email = 5;
}

message SetOrganizerNotificationSettingsRequest {
    string organizer_id = 1;
    // Канал не передан — не трогать. clear_* — сбросить свои настройки
    // канала и вернуться к платформенным.
    optional SetSmsSettingsRequest sms = 2;
    bool clear_sms = 3;
    optional SetEmailSettingsRequest email = 4;
    bool clear_email = 5;
}
