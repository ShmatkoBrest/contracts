syntax =  "proto3";

package seat.v1;

service SeatService {
    // Получение места по id
    rpc GetSeat (GetSeatRequest) returns (GetSeatResponse);
    // Пакетное получение мест по списку id (booking-service при бронировании
    // на несколько мест — вместо N поштучных GetSeat). Статус брони не
    // вычисляется. Несуществующие id молча пропускаются.
    rpc GetSeats (GetSeatsRequest) returns (GetSeatsResponse);
    //Получение мест для конкретного сектора
    rpc ListSeatsBySector (ListSeatsRequest) returns (ListSeatsResponse);

}

message GetSeatRequest {
    string id = 1;
}

message GetSeatResponse {
    Seat seat = 1;
}

message GetSeatsRequest {
    repeated string ids = 1;
}

message GetSeatsResponse {
    repeated Seat seats = 1;
}

message ListSeatsRequest {
    string sector_id = 1;
    // Пусто → вернуть места без статуса брони (для конструктора зала).
    string screening_id = 2;
}

message ListSeatsResponse {
    repeated Seat seats = 1;
}

message Seat {
    string id = 1;
    int32 row = 2;
    int32 number = 3;
    string status = 4;
    string type = 5;
    string sector_id = 6;
    // Координаты на схеме зала (для рендера SeatMap/конструктора).
    optional int32 x = 7;
    optional int32 y = 8;
}