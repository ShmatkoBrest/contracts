syntax = "proto3";

package screening.v1;
import "google/protobuf/timestamp.proto";

service ScreeningService {
    // Создание сеанса
    rpc CreateScreening (CreateScreeningRequest) returns (CreateScreeningResponse);
    // Получение списка сеансов
    rpc GetScreenings (GetScreeningsRequest) returns (GetScreeningsResponse);
    // Получение сеансов по событию
    rpc GetScreeningsByEvent (GetScreeningsByEventRequest) returns (GetScreeningsByEventResponse);
    // Получение сеанса по id
    rpc GetScreening (GetScreeningRequest) returns (GetScreeningResponse);
    // Обновление сеанса
    rpc UpdateScreening (UpdateScreeningRequest) returns (UpdateScreeningResponse);
    // Удаление сеанса
    rpc DeleteScreening (DeleteScreeningRequest) returns (DeleteScreeningResponse);

    // --- Права кассиров на продажу сеанса (3.8.0) ---
    // Список id кассиров, которым разрешён этот сеанс. Пустой список = сеанс
    // открыт всем кассирам (обратная совместимость).
    rpc GetScreeningCashiers (GetScreeningCashiersRequest) returns (ScreeningCashiersResponse);
    // Заменить список разрешённых кассиров целиком.
    rpc SetScreeningCashiers (SetScreeningCashiersRequest) returns (ScreeningCashiersResponse);
    // Проверка: может ли кассир продавать этот сеанс (для booking-service).
    rpc CanCashierSell (CanCashierSellRequest) returns (CanCashierSellResponse);

    // --- Доступ контролёров к сканированию сеанса (3.57.0) ---
    // Список id контролёров, которым разрешён этот сеанс. Пустой список =
    // сеанс недоступен ни одному контролёру (deny-by-default, тот же
    // принцип, что и у ScreeningCashier после 2026-09-16).
    rpc GetScreeningScanners (GetScreeningScannersRequest) returns (ScreeningScannersResponse);
    // Заменить список разрешённых контролёров целиком.
    rpc SetScreeningScanners (SetScreeningScannersRequest) returns (ScreeningScannersResponse);
    // Проверка: может ли контролёр сканировать этот сеанс (для gateway-service).
    rpc CanScannerAccess (CanScannerAccessRequest) returns (CanScannerAccessResponse);

    // --- Доступ охраны к сканированию сеанса (3.58.0) ---
    // Тот же deny-by-default принцип, что у ScreeningScanner — ОТДЕЛЬНОЕ
    // назначение, не смешивается с контролёрами (роль другая, права шире:
    // «выпустить» + аналитика прохода, см. gateway-service.scanner.controler.ts).
    rpc GetScreeningSecurity (GetScreeningSecurityRequest) returns (ScreeningSecurityResponse);
    rpc SetScreeningSecurity (SetScreeningSecurityRequest) returns (ScreeningSecurityResponse);
    rpc CanSecurityAccess (CanSecurityAccessRequest) returns (CanSecurityAccessResponse);
}

message CreateScreeningRequest {
    string event_id = 1;
    // Сеанс проводится на всей арене. Сектор покупатель/кассир выбирает
    // при выборе мест (contracts 3.7.0 — раньше здесь был sector_id).
    string arena_id = 2;
    string start_at = 3;
    string end_at = 4;
}

message CreateScreeningResponse {
    bool ok = 1;
}

message GetScreeningsRequest {
    optional string arena_id = 1;
    optional string date = 2;
    // 3.8.0: если задан — только сеансы, которые разрешено продавать этому
    // кассиру (сеансы без назначенных кассиров разрешены всем).
    optional string cashier_id = 3;
    // 3.21.0: конец диапазона дат (включительно), YYYY-MM-DD. Не задан —
    // старое поведение (один день `date`). Задан без `date` — игнорируется
    // (диапазон без начала не имеет смысла).
    optional string date_to = 4;
    // 3.57.0: если задан — только сеансы, которые разрешено сканировать
    // этому контролёру (deny-by-default — сеанс без назначенных
    // контролёров не виден никому, независимо от этого фильтра).
    optional string scanner_id = 5;
    // 3.58.0: то же самое, только для роли «охрана» (отдельное назначение).
    optional string security_id = 6;
}

message GetScreeningsResponse {
    repeated Screening screenings = 1;
}

message GetScreeningsByEventRequest {
    string event_id = 1;
    optional string date = 2;
}

message GetScreeningsByEventResponse {
    repeated Screening screenings = 1;
}

message GetScreeningRequest {
    string id = 1;
}

message GetScreeningResponse {
    Screening screening = 1;
}

message UpdateScreeningRequest {
    string id = 1;
    optional string event_id = 2;
    optional string arena_id = 3;
    optional string start_at = 4;
    optional string end_at = 5;
    // 3.55.0 — кастомизация кнопки embed-виджета продажи (см. Screening ниже).
    optional string widget_button_border_radius = 6;
    optional string widget_button_border_color = 7;
    optional string widget_button_background_color = 8;
    optional string widget_button_font_family = 9;
    // 3.56.0
    optional string widget_button_text_color = 10;
}

message UpdateScreeningResponse {
    Screening screening = 1;
}

message DeleteScreeningRequest {
    string id = 1;
}

message DeleteScreeningResponse {
    bool ok = 1;
}

// --- Права кассиров (3.8.0) ---

message GetScreeningCashiersRequest {
    string screening_id = 1;
}

message SetScreeningCashiersRequest {
    string screening_id = 1;
    // id аккаунтов кассиров. Пустой список = сеанс открыт всем кассирам.
    repeated string cashier_ids = 2;
}

message ScreeningCashiersResponse {
    repeated string cashier_ids = 1;
}

message CanCashierSellRequest {
    string cashier_id = 1;
    string screening_id = 2;
}

message CanCashierSellResponse {
    bool allowed = 1;
}

// --- Доступ контролёров к сканированию (3.57.0) ---

message GetScreeningScannersRequest {
    string screening_id = 1;
}

message SetScreeningScannersRequest {
    string screening_id = 1;
    // id аккаунтов контролёров. Пустой список = сеанс недоступен ни
    // одному контролёру (deny-by-default).
    repeated string scanner_ids = 2;
}

message ScreeningScannersResponse {
    repeated string scanner_ids = 1;
}

message CanScannerAccessRequest {
    string scanner_id = 1;
    string screening_id = 2;
}

message CanScannerAccessResponse {
    bool allowed = 1;
}

// --- Доступ охраны к сканированию (3.58.0) ---

message GetScreeningSecurityRequest {
    string screening_id = 1;
}

message SetScreeningSecurityRequest {
    string screening_id = 1;
    // id аккаунтов охраны. Пустой список = сеанс недоступен ни одному
    // охраннику (deny-by-default).
    repeated string security_ids = 2;
}

message ScreeningSecurityResponse {
    repeated string security_ids = 1;
}

message CanSecurityAccessRequest {
    string security_id = 1;
    string screening_id = 2;
}

message CanSecurityAccessResponse {
    bool allowed = 1;
}

message Event {
    string id = 1;
    string title = 2;
    string slug = 3;
    string poster = 4;
    int32 rating_age = 5;
    google.protobuf.Timestamp release_date = 6;
}

message Screening {
    string id = 1;
    google.protobuf.Timestamp start_at = 2;
    google.protobuf.Timestamp end_at = 3;
    // Сеанс на всей арене. Секторы и их места запрашиваются отдельно
    // (sector.v1 ListSectorsByArena / seat.v1) при выборе мест.
    Arena arena = 4;
    Event event = 6;
    // 5 (Sector sector) и 7 (repeated SeatType seat_type) удалены в 3.7.0.
    // 3.55.0 — конфигурация кнопки embed-виджета продажи билетов на этот
    // сеанс (карточка сеанса → «Виджет»). Не задано — widget.js использует
    // свои дефолты.
    optional string widget_button_border_radius = 8;
    optional string widget_button_border_color = 9;
    optional string widget_button_background_color = 10;
    optional string widget_button_font_family = 11;
    // 3.56.0
    optional string widget_button_text_color = 12;
}

message Arena {
    string id = 1;
    string name = 2;
    string address = 3;
    string image = 4;
}