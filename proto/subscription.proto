syntax = "proto3";

package subscription.v1;

import "google/protobuf/timestamp.proto";

service SubscriptionService {
    // Планы абонементов
    rpc CreateSubscriptionPlan (CreateSubscriptionPlanRequest) returns (SubscriptionPlan);
    rpc UpdateSubscriptionPlan (UpdateSubscriptionPlanRequest) returns (SubscriptionPlan);
    rpc DeleteSubscriptionPlan (DeleteSubscriptionPlanRequest) returns (DeleteResponse);
    rpc GetSubscriptionPlan (GetSubscriptionPlanRequest) returns (SubscriptionPlan);
    rpc ListSubscriptionPlans (ListSubscriptionPlansRequest) returns (ListSubscriptionPlansResponse);

    // Абонементы пользователей
    rpc PurchaseSubscription (PurchaseSubscriptionRequest) returns (PurchaseSubscriptionResponse);
    rpc CancelSubscription (CancelSubscriptionRequest) returns (UserSubscription);
    rpc GetUserSubscriptions (GetUserSubscriptionsRequest) returns (GetUserSubscriptionsResponse);
    rpc GetSubscription (GetSubscriptionRequest) returns (UserSubscription);

    // Доступ
    rpc CheckSubscriptionAccess (CheckSubscriptionAccessRequest) returns (CheckSubscriptionAccessResponse);

    // Бронирования по абонементам
    rpc ReleaseSubscriptionSeat (ReleaseSubscriptionSeatRequest) returns (DeleteResponse);
    rpc ListSubscriptionReservations (ListSubscriptionReservationsRequest) returns (ListSubscriptionReservationsResponse);

    // ===== 3.13.0: продление абонементов на новый сезон =====
    // Кампании продления (админ)
    rpc CreateRenewalCampaign (CreateRenewalCampaignRequest) returns (RenewalCampaign);
    rpc UpdateRenewalCampaign (UpdateRenewalCampaignRequest) returns (RenewalCampaign);
    rpc StartRenewalCampaign (RenewalCampaignIdRequest) returns (RenewalCampaign);
    rpc CloseRenewalCampaign (RenewalCampaignIdRequest) returns (RenewalCampaign);
    rpc ListRenewalCampaigns (ListRenewalCampaignsRequest) returns (ListRenewalCampaignsResponse);
    // Продление (пользователь)
    rpc ListRenewalOffers (ListRenewalOffersRequest) returns (ListRenewalOffersResponse);
    rpc RenewSubscription (RenewSubscriptionRequest) returns (PurchaseSubscriptionResponse);
    rpc GetSeasonSeatMap (GetSeasonSeatMapRequest) returns (GetSeasonSeatMapResponse);
    rpc ReleaseSeasonSeat (ReleaseSeasonSeatRequest) returns (DeleteResponse);
    // 3.15.0: занятость мест плана вне кампании продления (для отображения при
    // прямой покупке и для защиты от повторной продажи одного места).
    rpc GetPlanSeatMap (GetPlanSeatMapRequest) returns (GetPlanSeatMapResponse);

    // 3.16.0: продажа абонемента кассиром (наличные/терминал, без шлюза) + привязка
    // офлайн-купленного абонемента в личном кабинете по коду.
    rpc CreateCashierSubscriptionSale (CreateCashierSubscriptionSaleRequest) returns (CreateCashierSubscriptionSaleResponse);
    rpc ClaimSubscription (ClaimSubscriptionRequest) returns (UserSubscription);
    rpc ListCashierSubscriptionSales (ListCashierSubscriptionSalesRequest) returns (ListCashierSubscriptionSalesResponse);
}

// ===== SubscriptionPlan =====

enum SubscriptionType {
    FIXED_SEAT = 0;
    GENERAL_ADMISSION = 1;
}

message CreateSubscriptionPlanRequest {
    string title = 1;
    string description = 2;
    SubscriptionType type = 3;
    int32 price = 4;
    repeated string event_group_ids = 5;
}

message UpdateSubscriptionPlanRequest {
    string id = 1;
    optional string title = 2;
    optional string description = 3;
    optional int32 price = 4;
    optional bool active = 5;
    // Отсутствие поля — не трогать список групп; EventGroupIdList с пустым
    // ids — явно очистить список (тот же приём, что PerformerIdList
    // в event.proto).
    optional EventGroupIdList event_group_ids = 6;
}

message EventGroupIdList {
    repeated string ids = 1;
}

message DeleteSubscriptionPlanRequest {
    string id = 1;
}

message GetSubscriptionPlanRequest {
    string id = 1;
}

message ListSubscriptionPlansRequest {
    optional bool active_only = 1;
}

message ListSubscriptionPlansResponse {
    repeated SubscriptionPlan plans = 1;
}

message SubscriptionPlan {
    string id = 1;
    string title = 2;
    string description = 3;
    SubscriptionType type = 4;
    int32 price = 5;
    bool active = 6;
    repeated string event_group_ids = 7;
    // 3.13.0: id активной кампании продления, целью которой является этот план
    // (пусто, если такой нет). Фронту — чтобы включить карту мест сезона.
    string renewal_campaign_id = 8;
}

// ===== UserSubscription =====

enum SubscriptionStatus {
    PENDING = 0;
    ACTIVE = 1;
    EXPIRED = 2;
    BLOCKED = 3;
    CANCELED = 4;
}

message PurchaseSubscriptionRequest {
    string user_id = 1;
    string plan_id = 2;
    // Одно место (обратная совместимость) — трактуется как один элемент seats,
    // если seats пуст. Обязательны (одно из двух) для планов с type = FIXED_SEAT.
    optional string seat_id = 3;
    optional string sector_id = 4;
    // 3.15.0: несколько мест — несколько отдельных подписок одним платежом.
    repeated SeatRef seats = 5;
}

message PurchaseSubscriptionResponse {
    // Первая созданная подписка (обратная совместимость).
    string subscription_id = 1;
    // Ссылка на форму оплаты у провайдера — одна на все созданные подписки.
    string url = 2;
    // 3.15.0: все подписки, созданные этой покупкой.
    repeated string subscription_ids = 3;
}

message CancelSubscriptionRequest {
    string id = 1;
    string user_id = 2;
}

message GetUserSubscriptionsRequest {
    string user_id = 1;
}

message GetUserSubscriptionsResponse {
    repeated UserSubscription subscriptions = 1;
}

message GetSubscriptionRequest {
    string id = 1;
}

message UserSubscription {
    string id = 1;
    string user_id = 2;
    string plan_id = 3;
    SubscriptionStatus status = 4;
    optional google.protobuf.Timestamp valid_from = 5;
    optional google.protobuf.Timestamp valid_to = 6;
    // 3.15.0: закреплённые места (обычно одно — см. решение "несколько мест =
    // несколько подписок"). Пусто для GENERAL_ADMISSION.
    repeated SeatRef seats = 7;
    // 3.16.0: непусто только для кассовой продажи, ещё не привязанной ни к
    // какому аккаунту (claimed_at не выставлен).
    string claim_code = 8;
}

// ===== Access =====

message CheckSubscriptionAccessRequest {
    string user_id = 1;
    string event_id = 2;
}

message CheckSubscriptionAccessResponse {
    bool has_access = 1;
    optional string subscription_id = 2;
}

// ===== Reservations =====

enum SubscriptionReservationStatus {
    RESERVED = 0;
    RELEASED = 1;
    FAILED = 2;
}

message ReleaseSubscriptionSeatRequest {
    string subscription_id = 1;
    string screening_id = 2;
    string user_id = 3;
}

message ListSubscriptionReservationsRequest {
    string subscription_id = 1;
    string user_id = 2;
}

message ListSubscriptionReservationsResponse {
    repeated SubscriptionReservation reservations = 1;
}

message SubscriptionReservation {
    string id = 1;
    string subscription_id = 2;
    string screening_id = 3;
    optional string reservation_id = 4;
    SubscriptionReservationStatus status = 5;
}

// ===== Общее =====

message DeleteResponse {
    bool ok = 1;
}

// ===== 3.13.0: продление абонементов =====

enum RenewalCampaignStatus {
    RC_DRAFT = 0;
    RC_ACTIVE = 1;
    RC_CLOSED = 2;
}

message RenewalCampaign {
    string id = 1;
    string from_plan_id = 2;
    string to_plan_id = 3;
    // Длина окна приоритета в днях от started_at.
    int32 priority_days = 4;
    optional google.protobuf.Timestamp started_at = 5;
    RenewalCampaignStatus status = 6;
    // Скидка (0..100 %) для продления держателем абонемента from_plan.
    int32 renewal_discount_pct = 7;
    // Скидка (0..100 %) для любой покупки to_plan до early_bird_deadline.
    int32 early_bird_discount_pct = 8;
    optional google.protobuf.Timestamp early_bird_deadline = 9;
    // Вычисляемые: "PRIORITY" | "OPEN" | "" (для DRAFT/CLOSED).
    string phase = 10;
    optional google.protobuf.Timestamp priority_until = 11;
}

message RenewalCampaignIdRequest {
    string id = 1;
}

message CreateRenewalCampaignRequest {
    string from_plan_id = 1;
    string to_plan_id = 2;
    int32 priority_days = 3;
    int32 renewal_discount_pct = 4;
    int32 early_bird_discount_pct = 5;
    optional google.protobuf.Timestamp early_bird_deadline = 6;
}

message UpdateRenewalCampaignRequest {
    string id = 1;
    optional int32 priority_days = 2;
    optional int32 renewal_discount_pct = 3;
    optional int32 early_bird_discount_pct = 4;
    optional google.protobuf.Timestamp early_bird_deadline = 5;
}

message ListRenewalCampaignsRequest {
    optional RenewalCampaignStatus status = 1;
}

message ListRenewalCampaignsResponse {
    repeated RenewalCampaign campaigns = 1;
}

message SeatRef {
    string seat_id = 1;
    string sector_id = 2;
    // 3.17.0: скидка на конкретное место при кассовой продаже абонемента
    // (0..100 %) — например, один держатель детский, другой полный тариф.
    // Игнорируется вне CreateCashierSubscriptionSale (в PurchaseSubscription
    // не читается).
    optional int32 discount_pct = 3;
}

message RenewalOffer {
    string campaign_id = 1;
    string from_subscription_id = 2;
    string to_plan_id = 3;
    string to_plan_title = 4;
    // Текущие места абонемента (строго свои — приоритет на продление).
    repeated SeatRef my_seats = 5;
    string phase = 6;
    optional google.protobuf.Timestamp priority_until = 7;
    // Цена продления «своё место» (с учётом скидки продления).
    int32 price_keep = 8;
    // Базовая цена to_plan без скидок.
    int32 base_price = 9;
}

message ListRenewalOffersRequest {
    string user_id = 1;
}

message ListRenewalOffersResponse {
    repeated RenewalOffer offers = 1;
}

message RenewSubscriptionRequest {
    string user_id = 1;
    string from_subscription_id = 2;
    // Пусто → продлить своё место. Иначе — другое место; в фазе PRIORITY
    // должно быть доступно по карте мест сезона.
    optional string seat_id = 3;
    optional string sector_id = 4;
}

message GetSeasonSeatMapRequest {
    string campaign_id = 1;
    string user_id = 2;
    optional string sector_id = 3;
}

message SeasonSeat {
    string seat_id = 1;
    // MINE | TAKEN | HELD
    string status = 2;
    // 3.17.0: непусто в GetPlanSeatMapResponse (карта занятости плана без
    // фильтра по сектору — нужно знать, к какому сектору относится место, для
    // подсчёта занято/свободно по секторам). Пусто в GetSeasonSeatMapResponse
    // (там вызывающая сторона уже знает sector_id — сама его передала).
    string sector_id = 3;
}

message GetSeasonSeatMapResponse {
    string phase = 1;
    // Только места со статусом; остальные фронт трактует как свободные (OPEN)
    // либо недоступные (PRIORITY).
    repeated SeasonSeat seats = 2;
}

message ReleaseSeasonSeatRequest {
    string user_id = 1;
    string from_subscription_id = 2;
}

// ===== 3.15.0: занятость мест плана без кампании =====

message GetPlanSeatMapRequest {
    string plan_id = 1;
    optional string sector_id = 2;
}

message GetPlanSeatMapResponse {
    // Только занятые места (status всегда "TAKEN"); остальные — свободны.
    repeated SeasonSeat seats = 1;
}

// ===== 3.16.0: касса + привязка офлайн-покупки =====

message CreateCashierSubscriptionSaleRequest {
    string cashier_id = 1;
    // Если известен — продажа сразу атрибутируется этому аккаунту (без кода
    // привязки). Не собирается текущим кассовым UI — заполняется только при
    // прямом вызове API.
    optional string customer_id = 2;
    string plan_id = 3;
    // Пусто для GENERAL_ADMISSION (одна подписка без места). discount_pct
    // каждого SeatRef — скидка именно на это место (0..100 %).
    repeated SeatRef seats = 4;
    // cash | terminal.
    string payment_type = 5;
    // Непрозрачная ссылка на открытую смену кассира в booking-service —
    // резолвится и передаётся gateway, subscription-service её не проверяет.
    string shift_id = 6;
    // 3.17.0: скидка для GENERAL_ADMISSION-плана (там нет seats, поэтому
    // discount_pct самого SeatRef неприменим). Игнорируется для FIXED_SEAT.
    optional int32 discount_pct = 7;
}

message CashierSubscriptionSaleItem {
    string subscription_id = 1;
    // Пусто, если продажа сразу атрибутирована customer_id (привязывать нечего).
    string claim_code = 2;
    // 3.17.0: фактическая цена именно этого места после скидки кассира
    // (и, если применимо, скидки кампании продления) — места одной продажи
    // могут стоить по-разному.
    int32 amount = 3;
}

message CreateCashierSubscriptionSaleResponse {
    repeated CashierSubscriptionSaleItem items = 1;
    // Сумма продажи целиком (за все места).
    int32 amount = 2;
}

message ClaimSubscriptionRequest {
    string user_id = 1;
    string code = 2;
}

message ListCashierSubscriptionSalesRequest {
    string shift_id = 1;
}

message CashierSubscriptionSaleRow {
    string subscription_id = 1;
    string plan_id = 2;
    string plan_title = 3;
    int32 amount = 4;
    string payment_type = 5;
    google.protobuf.Timestamp sold_at = 6;
}

message ListCashierSubscriptionSalesResponse {
    repeated CashierSubscriptionSaleRow rows = 1;
}
