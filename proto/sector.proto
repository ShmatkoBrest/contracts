syntax = "proto3";

package sector.v1;

service SectorService {
    // Создание сектора
    rpc CreateSector (CreateSectorRequest) returns (CreateSectorResponse);
    // Получение сектора по id
    rpc GetSector (GetSectorRequest) returns (GetSectorResponse);
    // Получение сектора по id вместе с раскладкой мест по рядам
    // (актуально только для секторов с mode = RESERVED)
    rpc GetSectorWithSeats (GetSectorRequest) returns (GetSectorWithSeatsResponse);
    // Получение секторов для конкретной арены
    rpc ListSectorsByArena (ListSectorsRequest) returns (ListSectorsResponse);
    // Обновление сектора
    rpc UpdateSector (UpdateSectorRequest) returns (UpdateSectorResponse);
    // Удаление сектора
    rpc DeleteSector (DeleteSectorRequest) returns (DeleteSectorResponse);
}

message CreateSectorRequest {
    string name = 1;
    string arena_id = 2;
    // layout используется только при mode = RESERVED (места по раскладке рядов).
    repeated RowLayout layout = 3;
    // По умолчанию RESERVED (0) — обычный сектор с конкретными местами.
    SectorMode mode = 4;
    // Обязателен при mode = GENERAL_ADMISSION, иначе игнорируется.
    optional int32 capacity = 5;
    // Свободный режим редактора: явные координаты каждого места. Если
    // непусто — используется вместо генерации из `layout`.
    repeated SeatPositionInput seats = 6;
    // Метаданные редактора (полигон сектора на плане арены, трансформ) —
    // JSON-строка, arena-service хранит как есть.
    optional string shape_json = 7;
}

message CreateSectorResponse {
    Sector sector = 1;
}

message GetSectorRequest {
    string id = 1;
}

message GetSectorResponse {
    Sector sector = 1;
}

message GetSectorWithSeatsResponse {
    Sector sector = 1;
    // Актуально только для mode = RESERVED; для GENERAL_ADMISSION — пустой список.
    repeated RowLayout layout = 2;
}

message ListSectorsRequest {
    string arena_id = 1;
}

message ListSectorsResponse {
    repeated Sector sectors = 1;
}

message SeatPositionInput {
    int32  row    = 1;
    int32  number = 2;
    int32  x      = 3;
    int32  y      = 4;
    string type   = 5;
}

message UpdateSectorRequest {
    string id = 1;
    string name = 2;
    // Используется только для секторов с mode = RESERVED.
    repeated RowLayout layout = 3;
    // Свободный режим (см. CreateSectorRequest.seats).
    repeated SeatPositionInput seats = 5;
    optional string shape_json = 6;
    // Используется только для секторов с mode = GENERAL_ADMISSION.
    // Режим сектора (mode) неизменяем после создания — здесь его нет
    // намеренно: смена режима постфактум означала бы либо удаление уже
    // созданных мест, либо потерю данных о capacity, и требует отдельного
    // явного решения, а не безусловной перезаписи через Update.
    optional int32 capacity = 4;
}

message UpdateSectorResponse {
    Sector sector = 1;
}

message DeleteSectorRequest {
    string id = 1;
}

message DeleteSectorResponse {
    bool success = 1;
}

// RESERVED — сектор с конкретными местами (продажа привязана к seatId).
// GENERAL_ADMISSION — сектор без конкретных мест, продажа идёт по
// количеству (capacity), например фан-зона на 5000 билетов без рассадки.
enum SectorMode {
    RESERVED = 0;
    GENERAL_ADMISSION = 1;
}

message Sector {
    string id = 1;
    string name = 2;
    string arena_id = 3;
    SectorMode mode = 4;
    optional int32 capacity = 5;
    // Метаданные редактора зала (полигон/трансформ) — JSON-строка.
    optional string shape_json = 6;
}

message RowLayout {
    int32 row = 1;
    // Кол-во реальных мест в ряду.
    int32 columns = 2;
    string type = 3;

    // Геометрия/нумерация ряда — всё опционально, при отсутствии
    // arena-service ведёт себя как раньше (прямоугольная сетка,
    // x = номер места, y = номер ряда, нумерация с 1).
    optional int32  start_number = 4;   // с какого номера нумеровать (по умолчанию 1)
    repeated int32  gaps         = 5;   // номера-проходы: слот пропускается (место не создаётся)
    optional double seat_spacing = 6;   // шаг между местами по X (по умолчанию 1)
    optional double row_spacing  = 7;   // шаг между рядами по Y (по умолчанию 1)
    optional double offset_x     = 8;   // сдвиг всего ряда по X (ступенчатые трибуны)
    optional double curve        = 9;   // кривизна ряда: смещение по Y = curve * (i - center)^2
}