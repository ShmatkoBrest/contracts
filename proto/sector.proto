syntax = "proto3";

package sector.v1;

service SectorService {
    // Создание сектора
    rpc CreateSector (CreateSectorRequest) returns (CreateSectorResponse);
    // Получение сектора по id
    rpc GetSector (GetSectorRequest) returns (GetSectorResponse);
    // Получение сектора по id вместе с раскладкой мест по рядам
    // (актуально только для секторов с mode = RESERVED)
    rpc GetSectorWithSeats (GetSectorRequest) returns (GetSectorWithSeatsResponse);
    // Получение секторов для конкретной арены
    rpc ListSectorsByArena (ListSectorsRequest) returns (ListSectorsResponse);
    // Обновление сектора
    rpc UpdateSector (UpdateSectorRequest) returns (UpdateSectorResponse);
    // Удаление сектора
    rpc DeleteSector (DeleteSectorRequest) returns (DeleteSectorResponse);
}

message CreateSectorRequest {
    string name = 1;
    string arena_id = 2;
    // layout используется только при mode = RESERVED (места по раскладке рядов).
    repeated RowLayout layout = 3;
    // Всегда RESERVED (0) — обычный сектор с конкретными местами
    int32 mode = 4;  // 0 = RESERVED, 1 = GENERAL_ADMISSION (пока не используется)
    // Обязателен при mode = GENERAL_ADMISSION, иначе игнорируется.
    optional int32 capacity = 5;
}

message CreateSectorResponse {
    Sector sector = 1;
}

message GetSectorRequest {
    string id = 1;
}

message GetSectorResponse {
    Sector sector = 1;
}

message GetSectorWithSeatsResponse {
    Sector sector = 1;
    // Актуально только для mode = RESERVED; для GENERAL_ADMISSION — пустой список.
    repeated RowLayout layout = 2;
}

message ListSectorsRequest {
    string arena_id = 1;
}

message ListSectorsResponse {
    repeated Sector sectors = 1;
}

message UpdateSectorRequest {
    string id = 1;
    string name = 2;
    // Используется только для секторов с mode = RESERVED.
    repeated RowLayout layout = 3;
    // Используется только для секторов с mode = GENERAL_ADMISSION.
    optional int32 capacity = 4;
}

message UpdateSectorResponse {
    Sector sector = 1;
}

message DeleteSectorRequest {
    string id = 1;
}

message DeleteSectorResponse {
    bool success = 1;
}

// enum SectorMode удалён — всегда используем RESERVED (0)

message Sector {
    string id = 1;
    string name = 2;
    string arena_id = 3;
    int32 mode = 4;  // 0 = RESERVED, 1 = GENERAL_ADMISSION
    optional int32 capacity = 5;
}

message RowLayout {
    int32 row = 1;
    int32 columns = 2;
    string type = 3;
    int32 price = 4;
}