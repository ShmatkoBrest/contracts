syntax = "proto3";

package payment.v1;

service PaymentService {
  // Создание платежа
  rpc CreatePayment (CreatePaymentRequest) returns (CreatePaymentResponse);
  // Статус платежа по брони (для экрана /checkout/result — фронт поллит)
  rpc GetPaymentByBooking (GetPaymentByBookingRequest) returns (PaymentStatus);
  // Обработка  (начисление брони) от платежной системы
  rpc ProcessPaymentEvent (ProcessPaymentEventRequest) returns (ProcessPaymentEventResponse);
  //
  rpc GetUserPaymentMethods (GetUserPaymentMethodsRequest) returns (GetUserPaymentMethodsResponse);
  //
  rpc CreatePaymentMethod (CreatePaymentMethodRequest) returns (CreatePaymentMethodResponse);
  //
  rpc VerifyPaymentMethod (VerifyPaymentMethodRequest) returns (VerifyPaymentMethodResponse);
  //
  rpc DeletePaymentMethod (DeletePaymentMethodRequest) returns (DeletePaymentMethodResponse);

  // Создание платежа общего назначения — без привязки к брони через
  // booking-service (в отличие от CreatePayment). Используется сервисами,
  // которым нужно просто списать сумму и получить ссылку на оплату —
  // например, subscription-service при покупке абонемента.
  //
  // callback_url в запросе указывает вызывающая сторона — платёжный
  // провайдер шлёт вебхук напрямую туда (не в payment-service), поэтому
  // payment-service не обязан знать об исходе платежа и не должен
  // звонить обратно в вызывающий сервис — это сознательное архитектурное
  // решение, чтобы не заводить новый порт вроде SubscriptionPort здесь.
  // payment-service отвечает только за инициацию платежа у провайдера.
  rpc CreateGenericPayment (CreateGenericPaymentRequest) returns (CreateGenericPaymentResponse);

}
message CreatePaymentRequest {
  string user_id = 1;
  string screening_id = 2;
  repeated SeatInput seats = 3;
  optional string payment_method_id = 4;
  bool save_payment_method = 5;
  // Списать баллы лояльности на заказ (копейки, loyalty.v1).
  int32 redeem_points = 6;
}
message CreatePaymentResponse {
  string url = 1;
  // id брони/заказа — фронт использует для опроса статуса после возврата
  // от платёжного провайдера.
  string booking_id = 2;
}

message GetPaymentByBookingRequest {
  string booking_id = 1;
  string user_id = 2;
}

message PaymentStatus {
  string id = 1;
  string booking_id = 2;
  int32  amount = 3;
  // pending | succeeded | canceled | failed
  string status = 4;
  // Ссылка на форму оплаты (актуальна, пока status = pending).
  string url = 5;
}

message ProcessPaymentEventRequest {
    //status
    string event = 1;
    string payment_id = 2;
    string booking_id = 3;
    string user_id = 4;
    bool save_payment_method = 5;
    string provider_method_id = 6;
    string card_first6 = 7;
    string card_last4 = 8;
    string bank = 9;
    string brand = 10;
}

message ProcessPaymentEventResponse {
    bool ok = 1;
}

message GetUserPaymentMethodsRequest {
  string user_id = 1;
}

message GetUserPaymentMethodsResponse {
  repeated PaymentMethodItem methods = 1;
}

message CreatePaymentMethodRequest {
  string user_id = 1;
}

message CreatePaymentMethodResponse {
  string id = 1;
  string url = 2;
}

message VerifyPaymentMethodRequest {
  string user_id = 1;
  string method_id = 2;
}

message VerifyPaymentMethodResponse {
  bool ok = 1;
}

message DeletePaymentMethodRequest {
  string user_id = 1;
  string method_id = 2;
}

message DeletePaymentMethodResponse {
  bool ok = 1;
}

message PaymentMethodItem {
  string id = 1;
  string bank = 2;
  string brand = 3;
  string first6 = 4;
  string last4 = 5;
}

message SeatInput {
    string seat_id = 1;
}

message CreateGenericPaymentRequest {
  string user_id = 1;
  // Сумма в минимальных единицах валюты (копейки/центы) — согласовано
  // с платформенным соглашением (booking-service, payment-service сами
  // хранят суммы как Int).
  int32 amount = 2;
  string description = 3;
  string return_url = 4;
  // Вызывающая сторона указывает СВОЙ callback_url — платёжный провайдер
  // шлёт вебхук туда напрямую, а не в payment-service.
  string callback_url = 5;
  // Произвольные метаданные, которые платёжная система вернёт в вебхуке
  // без изменений (например, subscription_id, user_subscription_id) —
  // позволяет вызывающей стороне идентифицировать платёж на своей стороне.
  map<string, string> metadata = 6;
}

message CreateGenericPaymentResponse {
  string payment_id = 1;
  string url = 2;
}