syntax = "proto3";

package organizer.v1;

import "google/protobuf/empty.proto";

// Сервис для работы с организаторами событий.
service OrganizerService {
    rpc ListOrganizers (google.protobuf.Empty) returns (ListOrganizersResponse);
    rpc GetOrganizer (GetOrganizerRequest) returns (GetOrganizerResponse);

    // Лицензионный ключ (для развёртываний фронтенда на стороннем хостинге).
    rpc GetOrganizerLicense (GetOrganizerLicenseRequest) returns (GetOrganizerLicenseResponse);
    rpc SetOrganizerLicense (SetOrganizerLicenseRequest) returns (SetOrganizerLicenseResponse);

    // Ставка комиссии платформы для организатора (для отчёта и ручного выставления).
    rpc GetOrganizerCommission (GetOrganizerCommissionRequest) returns (GetOrganizerCommissionResponse);
    rpc SetOrganizerCommission (SetOrganizerCommissionRequest) returns (GetOrganizerCommissionResponse);

    // REMOVED (multi-tenant era — field numbers reserved):
    //   CreateOrganizer, UpdateOrganizer, DeleteOrganizer,
    //   GetOrganizerByDomain, ValidateLicenseKey,
    //   SetOrganizerModules, SetOrganizerSiteEnabled, RecordOrganizerSiteBuild
}

message ListOrganizersResponse {
    repeated Organizer organizers = 1;
}

message GetOrganizerRequest {
    string id = 1;
}

message GetOrganizerResponse {
    Organizer organizer = 1;
}

message Organizer {
    string id          = 1;
    string title       = 2;
    string description = 3;
    string image       = 4;

    // REMOVED (multi-tenant fields — field numbers reserved):
    reserved 5;  // domain
    reserved 9;  // commission_percent
    reserved 10; // disabled_modules
    reserved 11; // site_enabled
    reserved 12; // site_build_status
    reserved 13; // site_overlay_version
    reserved 14; // site_built_at
    reserved 15; // site_build_error
}

message GetOrganizerLicenseRequest {
    string organizer_id = 1;
}

message GetOrganizerLicenseResponse {
    string organizer_id  = 1;
    string license_key    = 2; // пусто — ключ ещё не выпущен
    string license_status = 3; // ACTIVE | TRIAL | REVOKED
    string license_expires_at = 4; // ISO-строка или ""
}

message SetOrganizerLicenseRequest {
    string organizer_id   = 1;
    string status         = 2; // ACTIVE | TRIAL | REVOKED
    string expires_at     = 3; // ISO-строка, пусто = бессрочно
    bool   regenerate_key = 4;
}

message SetOrganizerLicenseResponse {
    string organizer_id  = 1;
    string license_key    = 2;
    string license_status = 3;
    string license_expires_at = 4;
}

message GetOrganizerCommissionRequest {
    string organizer_id = 1;
}

message GetOrganizerCommissionResponse {
    string organizer_id = 1;
    // пусто / null — ставка не задана (используется платформенный дефолт)
    optional double commission_percent = 2;
}

message SetOrganizerCommissionRequest {
    string organizer_id       = 1;
    optional double commission_percent = 2;
    bool clear                = 3; // true — убрать ставку (вернуться к дефолту)
}
