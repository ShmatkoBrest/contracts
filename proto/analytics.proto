syntax = "proto3";

package analytics.v1;

// Аналитика платформы для админ-дашборда. analytics-service читает БД
// остальных сервисов read-only и агрегирует. Все суммы — в копейках.
service AnalyticsService {
    // Сводные KPI за период.
    rpc GetOverview (PeriodRequest) returns (Overview);
    // Динамика продаж по дням/неделям.
    rpc GetSalesTimeseries (TimeseriesRequest) returns (SalesTimeseries);
    // Топ событий по выручке/билетам.
    rpc GetTopEvents (TopEventsRequest) returns (TopEvents);
    // Заполняемость сеансов.
    rpc GetOccupancy (OccupancyRequest) returns (Occupancy);
    // Статистика по кассирам и сменам.
    rpc GetCashierStats (PeriodRequest) returns (CashierStats);
    // 3.32.0: выручка + ставка комиссии + расчётная сумма к перечислению по
    // организатору(ам). Организатор платит комиссию сам — это только отчёт,
    // ничего не удерживается автоматически. organizer_id не задан — все
    // организаторы (платформенный ADMIN); задан — один (self-service
    // ORGANIZER_ADMIN, видит только себя).
    rpc ListOrganizerCommissions (OrganizerCommissionsRequest) returns (OrganizerCommissions);
    // 3.35.0: сводка по одному сеансу (карточка сеанса в админке) — выручка/
    // билеты/заполняемость, без периода (сеанс — не диапазон дат).
    rpc GetScreeningSummary (GetScreeningSummaryRequest) returns (ScreeningSummary);
    // 3.57.0: контроль на входе — сколько билетов уже прошло и за какой
    // промежуток времени (первый/последний скан). Отдельно от
    // ScreeningSummary — та кэшируется на 60с и несёт финансовые поля,
    // которые сканеру/контролю на входе видеть не нужно.
    rpc GetCheckInStats (GetScreeningSummaryRequest) returns (CheckInStats);
}

// from/to — ISO-строки (границы включительно по created_at). Пусто — весь период.
message PeriodRequest {
    optional string from = 1;
    optional string to = 2;
    // 3.14.0: сузить до события/группы событий (взаимоисключающе на стороне клиента).
    optional string event_id = 3;
    optional string event_group_id = 4;
}

message Overview {
    int32 revenue = 1;          // сумма amount оплаченных заказов
    int32 orders = 2;           // число оплаченных заказов
    int32 tickets = 3;          // число оплаченных билетов
    int32 avg_check = 4;        // revenue / orders (0 при orders = 0)
    int32 refunds_amount = 5;
    int32 refunds_count = 6;
    int32 online_revenue = 7;   // payment_type IS NULL
    int32 cashier_revenue = 8;  // payment_type IN (cash, terminal)
}

message TimeseriesRequest {
    optional string from = 1;
    optional string to = 2;
    // day | week (по умолчанию day)
    string bucket = 3;
    optional string event_id = 4;
    optional string event_group_id = 5;
}

message SalesTimeseries {
    repeated TimeseriesPoint points = 1;
}

message TimeseriesPoint {
    string date = 1;      // YYYY-MM-DD — начало бакета
    int32 revenue = 2;
    int32 orders = 3;
    int32 tickets = 4;
}

message TopEventsRequest {
    optional string from = 1;
    optional string to = 2;
    int32 limit = 3;      // по умолчанию 10
    // revenue | tickets (по умолчанию revenue)
    string sort = 4;
    optional string event_id = 5;
    optional string event_group_id = 6;
}

message TopEvents {
    repeated TopEventItem items = 1;
}

message TopEventItem {
    string event_id = 1;
    string title = 2;
    int32 revenue = 3;
    int32 tickets = 4;
}

message OccupancyRequest {
    // фильтр по start_at сеанса
    optional string from = 1;
    optional string to = 2;
    optional string event_id = 3;
    int32 limit = 4;      // по умолчанию 20
    optional string event_group_id = 5;
}

message Occupancy {
    repeated OccupancyItem items = 1;
}

message OccupancyItem {
    string screening_id = 1;
    string event_title = 2;
    string start_at = 3;
    string sector_name = 4;
    int32 capacity = 5;   // число мест (RESERVED) или Sector.capacity (GA)
    int32 sold = 6;
    double rate = 7;      // sold / capacity
}

message CashierStats {
    repeated CashierStatItem cashiers = 1;
    repeated ShiftStatItem shifts = 2;
}

message CashierStatItem {
    string cashier_id = 1;
    int32 sales = 2;
    int32 revenue = 3;
    int32 cash_revenue = 4;
    int32 terminal_revenue = 5;
}

message ShiftStatItem {
    string shift_id = 1;
    string cashier_id = 2;
    string opened_at = 3;
    optional string closed_at = 4;
    int32 sales = 5;
    int32 revenue = 6;
    int32 cash_total = 7;
    int32 terminal_total = 8;
    int32 opening_cash = 9;
    optional int32 counted_cash = 10;
    optional int32 difference = 11;
}

message OrganizerCommissionsRequest {
    // Пусто — все организаторы. Задан — только этот (self-service).
    optional string organizer_id = 1;
    // Фильтр по created_at успешных платежей. Пусто — весь период.
    optional string from = 2;
    optional string to = 3;
}

message OrganizerCommissions {
    repeated OrganizerCommissionItem items = 1;
}

message OrganizerCommissionItem {
    string organizer_id = 1;
    string title = 2;
    // Не задана — ставка не назначена этому организатору (считать нечего).
    optional double commission_percent = 3;
    int32 revenue = 4;           // сумма успешных платежей организатора за период, копейки
    int32 payments_count = 5;
    // round(revenue * commission_percent / 100); отсутствует, если ставка не задана.
    optional int32 commission_amount = 6;
}

message GetScreeningSummaryRequest {
    string screening_id = 1;
}

// Возвраты сюда НЕ входят (та же честная причина, что и в Overview — таблица
// refunds в payment-service не хранит screening_id, сузить нечем).
message ScreeningSummary {
    int32 revenue = 1;
    int32 orders = 2;
    int32 tickets = 3;
    int32 avg_check = 4;
    int32 online_revenue = 5;
    int32 cashier_revenue = 6;
    int32 capacity = 7;          // сумма вместимости всех секторов арены сеанса
    int32 sold = 8;               // билетов PAID/RESERVED по всем секторам
    double occupancy_rate = 9;    // sold / capacity
    repeated ScreeningSectorSummary sectors = 10;
}

message ScreeningSectorSummary {
    string sector_name = 1;
    int32 capacity = 2;
    int32 sold = 3;
    double rate = 4;
}

// 3.57.0: контроль на входе — см. AnalyticsService.GetCheckInStats.
message CheckInStats {
    int32 total_tickets = 1;   // PAID-билеты сеанса (включая COMP)
    int32 checked_in = 2;
    int32 remaining = 3;
    // ISO, не задано (пустая строка) — ни одного прохода ещё не было.
    string first_check_in_at = 4;
    string last_check_in_at = 5;
}
